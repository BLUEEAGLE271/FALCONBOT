controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      transform_tolerance: 0.5
      time_steps: 80
      trajectory_point_step: 1
      model_dt: 0.05
      publish_optimal_trajectory: false
      visualize: false
      batch_size: 1000
      use_sim_time: False
      gamma: 0.015
      iteration_count: 1
      prune_distance: 2.0
      use_unordered_multithreading: true
      regenerate_noises: false      # Biggest single CPU saving
      # ... (keep your time_steps, batch_size, etc.) ...
      
      # 1. CHANGE THE MOTION MODEL
      motion_model: "Ackermann"  # <--- This is the key switch
      temperature: 0.3 
      # 2. DEFINE THE GEOMETRY (The "Cheat" Prevention)
      # This is the strict physical constraint you asked for.
      AckermannConstraints:
        min_turning_r: 0.3       # The robot CANNOT turn tighter than this (0.5m radius)
      
      # 3. SPEEDS (Mouse Mode)
      vx_max: 0.4
      vx_min: 0.0    # You NEED reverse to park with Ackermann (like a car parallel parking)
      wz_max: 1.2     # Max rotation speed

      vx_std: 0.1
      vy_std: 0.0  # Must be 0 for DiffDrive
      wz_std: 0.3
      
      # 4. CRITICS (Tuned for Arcs)
      # We remove 'PathAngleCritic' because it often tempts the robot to spin in place to fix heading.
      #critics: ["ConstraintCritic","CostCritic","PathAngleCritic","PathAlignCritic","PathFollowCritic","ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PreferForwardCritic"]
      critics: ["PathFollowCritic","PathAlignCritic","ConstraintCritic","GoalCritic", "GoalAngleCritic","ObstaclesCritic"]
      # ... (ObstaclesCritic, GoalCritic etc. remain same as before) ...
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.0
      # CRITICAL: This critic forces the robot to align with the path using curves, not spins.
      PathAlignCritic:
        enabled: true
        cost_power: 2
        cost_weight: 10.0
        trajectory_point_step: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 2
        use_path_orientation: true
      
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
        use_path_orientations: true


      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0   # How strongly it cares about the final angle
        threshold_to_consider: 0.5 # Only start worrying about the angle when within 0.5m of the goal

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.5  # LOW weight = Not afraid of walls (Mouse mode)
        critical_weight: 15.0  # HIGH weight = But never hit them
        near_goal_distance: 0.0
        consider_footprint: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 2
        threshold_to_consider: 0.4

      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 0.1
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.8
      always_send_full_costmap: False
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      ##robot_radius: 0.1
      footprint: "[[-0.097, -0.084], [-0.097, 0.084], [0.097, 0.084], [0.097, -0.084]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.04
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        enabled: True
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          inf_is_valid: true


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      always_send_full_costmap: False
      rolling_window: true
      width: 5
      height: 5
      ##robot_radius: 0.20
      footprint: "[[-0.097, -0.084], [-0.097, 0.084], [0.097, 0.084], [0.097, -0.084]]"
      transform_tolerance: 1.2
      resolution: 0.03
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_masked
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          inf_is_valid: true
      #static_layer:
        #plugin: "nav2_costmap_2d::StaticLayer"
        #map_subscribe_transient_local: True
        #map_topic: "/map"
        #subscribe_to_updates: true
        #map_republish_at_specific_frequency: false
        #track_unknown_space: true        

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.04


planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"  # <--- The "Car-Like" Planner
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.0
      use_final_approach_orientation: true
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN" # <--- "DUBIN" = Forward Only (No Reversing)
      non_straight_penalty: 100.0        # (Was 1.2) Punish turning
      cost_travel_multiplier: 1.0     # (Was 2.0) Punish long paths (loops are long)
      change_penalty: 50.0              # Punish changing from straight to turn
      retrospective_penalty: 0.0
      analytic_expansion_ratio: 3.5 
      analytic_expansion_max_length: 2.5
      angle_quantization_bins: 144
      minimum_turning_radius: 0.5     # <--- MUST match your controller's radius
      reverse_penalty: 100.0
      
      
      

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200