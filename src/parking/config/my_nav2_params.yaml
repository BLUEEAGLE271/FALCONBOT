controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.2

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── Speed ────────────────────────────────────────────────────────────────
      desired_linear_vel: 0.4
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      # ── Lookahead ────────────────────────────────────────────────────────────
      lookahead_dist: 0.3
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: true

      # ── Regulated velocity scaling ────────────────────────────────────────────
      regulated_linear_velocity_scaling: true
      regulated_rotation_scaling: true
      use_cost_regulated_linear_velocity_scaling: false

      # ── Collision / "Blindfold" ───────────────────────────────────────────────
      # CRITICAL: RPP will NOT abort when the local costmap shows the dock as an
      # obstacle during the final approach.  Visual servo takes over before contact.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # ── Rotation to heading ───────────────────────────────────────────────────
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 3.0

      # ── Dynamics ─────────────────────────────────────────────────────────────
      max_angular_accel: 3.2
      max_lateral_accel: 0.0
      transform_tolerance: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.8
      always_send_full_costmap: False
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.02
      footprint: "[[-0.097, -0.084], [-0.097, 0.084], [0.097, 0.084], [0.097, -0.084]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        enabled: True
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 10.0


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      always_send_full_costmap: False
      rolling_window: false
      footprint: "[[-0.097, -0.084], [-0.097, 0.084], [0.097, 0.084], [0.097, -0.084]]"
      transform_tolerance: 1.2
      resolution: 0.03
      track_unknown_space: true
      # obstacle_layer: global planner sees the box and prefers to route around it
      # during commute.  High cost_scaling_factor creates a soft gradient (not a
      # hard wall) so the RPP blindfold can still complete the final approach.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
        subscribe_to_updates: true
        track_unknown_space: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        enabled: True
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 10.0


planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.3
      use_final_approach_orientation: true
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"
      non_straight_penalty: 1.2
      cost_travel_multiplier: 5.0
      change_penalty: 10.0
      retrospective_penalty: 0.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      angle_quantization_bins: 144
      minimum_turning_radius: 0.3
      reverse_penalty: 5.0


behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    recovery_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 5.0]
    min_velocity: [0.0, 0.0, -5.0]
    max_accel:    [2.0, 0.0, 2.2]
    max_decel:    [-2.5, 0.0, -2.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# =============================================================================
# AMCL
# =============================================================================
amcl:
  ros__parameters:
    use_sim_time: False
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.8
    alpha2: 0.8
    alpha3: 0.2
    alpha4: 0.4
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.1
    update_min_a: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    scan_topic: /scan
    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_min_range: -1.0
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.4
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    always_reset_initial_pose: false
    first_map_only: false

# =============================================================================
# Map Server
# =============================================================================
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/blueeagle/ros2_ws/maps/my_lab_map_filtered.yaml"
