slam_toolbox:
  ros__parameters:
    # --- Frame Names ---
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    scan_topic: /scan

    # --- Mode: localization against a pre-built map ---
    mode: localization
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 5.0
    resolution: 0.1
    max_laser_range: 12.0

    # --- Coordinate Matcher ---
    minimum_time_interval: 0.3
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    scan_queue_size: 10
